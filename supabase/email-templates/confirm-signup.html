<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmá tu email</title>
</head>
<body style="margin:0;padding:0;background-color:#0b0b14;font-family:Inter,Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0b0b14;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#13131f;border:1px solid #2a2a42;border-radius:16px;overflow:hidden;">
          <tr>
            <td align="center" style="padding:32px 24px 8px;">
              <div style="font-size:26px;font-weight:800;color:#f5f5fa;letter-spacing:0.5px;">Watchly</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 32px;">
              <div style="width:48px;height:48px;border-radius:50%;background-color:rgba(139,92,246,0.15);color:#c084fc;font-size:24px;line-height:48px;margin:0 auto;">&#10003;</div>
              <h1 style="margin:20px 0 8px;font-size:20px;color:#f5f5fa;font-weight:700;">Confirmá tu email</h1>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#a2a2bd;">Hola, para activar tu cuenta hacé clic en el botón de abajo. Este enlace expira en 24 horas.</p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background-color:#8b5cf6;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 32px;border-radius:9999px;">Confirmar email</a>
              <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#71717a;">Si el botón no funciona, copiá y pegá este enlace en tu navegador:<br><span style="color:#a2a2bd;word-break:break-all;">{{ .ConfirmationURL }}</span></p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:16px 32px 28px;border-top:1px solid #2a2a42;background-color:#0e0e16;">
              <p style="margin:0;font-size:12px;color:#52525b;">&#169; {{ .SiteURL }} &middot; Watchly</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
